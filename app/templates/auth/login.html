{% extends "base.html" %}
{% block title %}Log In — CampusPrep{% endblock %}
{% block content %}
<div style="max-width: 440px; margin: 40px auto; padding: 20px;">
    <div class="card" style="padding: 32px;">
        <div style="text-align: center; margin-bottom: 24px;">
            <div class="brand-icon-box" style="margin: 0 auto 12px; width: 44px; height: 44px; font-size: 1.2rem;">CP</div>
            <h2 style="font-size: 1.5rem; margin-bottom: 6px;">Welcome Back</h2>
            <p style="color: var(--text-secondary); font-size: 0.9rem;">Log in to continue your placement preparation</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label class="form-label" for="email">College Email Address</label>
                <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" required placeholder="student@college.edu">
            </div>

            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <label class="form-label" for="password">Password</label>
                </div>
                <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••">
            </div>

            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; font-size: 0.85rem;">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text-secondary);">
                    <input type="checkbox" name="remember" value="1"> Remember this device
                </label>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 11px;">
                <i data-lucide="log-in"></i>
                <span>Log In to Dashboard</span>
            </button>
        </form>

        <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-light); text-align: center; font-size: 0.88rem; color: var(--text-secondary);">
            Don't have an account? <a href="{{ url_for('auth.register') }}" style="font-weight: 600;">Sign up free</a>
        </div>
    </div>

    <!-- Hackathon Quick Demo Credentials Note -->
    <div style="margin-top: 16px; padding: 12px 16px; background: #EEF3FD; border-radius: 8px; border: 1px solid #D5E2FA; font-size: 0.82rem; color: #1E469A;">
        <strong>Demo Account:</strong> <code>demo@campusprep.edu</code> / <code>Demo@1234</code>
    </div>
</div>
{% endblock %}
